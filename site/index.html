<!doctype html>
<html lang="ja" data-time="morning">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>はちべえ絵巻 — hatyibei</title>
  <meta name="description" content="hatyibei の頭の中の村を、右から左へ。水墨の絵巻で旅するポータル。" />
  <meta name="theme-color" content="#efe9dc" />
  <meta property="og:title" content="はちべえ絵巻 — hatyibei" />
  <meta property="og:description" content="hatyibei の頭の中の村を、右から左へ。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://github.com/hatyibei.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@hatyibeiSE" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Yuji+Syuku&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- shared SVG defs: brush-edge distortion -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </svg>

  <main id="stage" aria-label="はちべえ絵巻">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="world"></div>
    <canvas id="fg" aria-hidden="true"></canvas>
    <div id="paper" aria-hidden="true"></div>
  </main>

  <header id="hud">
    <div class="times" role="radiogroup" aria-label="時刻">
      <button role="radio" data-time="auto" aria-checked="true">いま</button>
      <button role="radio" data-time="morning" aria-checked="false">朝</button>
      <button role="radio" data-time="day" aria-checked="false">昼</button>
      <button role="radio" data-time="evening" aria-checked="false">夕</button>
      <button role="radio" data-time="night" aria-checked="false">夜</button>
    </div>
    <div class="hud-right">
      <button id="sound-btn" class="notebook-btn" aria-pressed="false">音 ○</button>
      <button id="notebook-btn" class="notebook-btn">旅人の手帳</button>
    </div>
  </header>

  <nav id="scrollbar" aria-label="場面">
    <div class="track"><div class="fill"></div></div>
    <div class="marks"></div>
  </nav>

  <p id="hint" aria-hidden="true"><span class="arrow">←</span> 巻物は右から左へ</p>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <form method="dialog"><button class="close" aria-label="閉じる">×</button></form>
    <div class="sheet-body"></div>
  </dialog>

  <div id="stamp" aria-live="polite"></div>

  <noscript>
    <div class="noscript">
      <h1>はちべえ絵巻 — hatyibei</h1>
      <p>AI Engineer / Forward Deployed Engineer</p>
      <ul>
        <li><a href="https://github.com/hatyibei">GitHub</a></li>
        <li><a href="https://x.com/hatyibeiSE">X (@hatyibeiSE)</a></li>
        <li><a href="https://zenn.dev/hatyibei">Zenn</a></li>
        <li><a href="https://gen-diag.com">gen-diag.com</a></li>
        <li><a href="https://www.npmjs.com/package/zero-config-cli-bridge">zero-config-cli-bridge</a></li>
      </ul>
    </div>
  </noscript>

  <script src="sound.js" defer></script>
  <script src="scenes.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
